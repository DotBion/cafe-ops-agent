name: Check build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          npm --prefix frontend ci
      - name: Run checks
        run: |
          python -m unittest discover -v
          python -m eval.benchmark --fixture --output /tmp/cafe-evaluation.json
          diff eval/fixture-report.json /tmp/cafe-evaluation.json
          npm --prefix frontend run build
      - name: Check the dashboard in Chrome
        run: |
          python -m pip install playwright==1.61.0
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/cafe-ops.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl --silent --fail http://127.0.0.1:8000/api/config > /dev/null; then break; fi
            sleep 0.25
          done
          python -m tests.browser_smoke
